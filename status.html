<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Strony/title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            border-bottom: 1px solid #21262d;
            background-color: #161b22;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-section svg {
            fill: #f0f6fc;
        }
        .logo-title {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
        }
        .main-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 16px;
        }
        .global-status {
            background-color: rgba(46, 160, 67, 0.15);
            border: 1px solid #2ea043;
            border-radius: 6px;
            padding: 24px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .status-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: #2ea043;
            box-shadow: 0 0 8px #2ea043;
        }
        .global-status-text {
            font-size: 18px;
            font-weight: 500;
            color: #56d364;
        }
        .panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
        }
        .panel-header {
            padding: 16px;
            background-color: #21262d;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
            font-size: 14px;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #30363d;
        }
        .status-row:last-child {
            border-bottom: none;
        }
        .system-name {
            font-size: 14px;
            font-weight: 500;
        }
        .system-status {
            font-size: 13px;
            color: #56d364;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .system-status::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #2ea043;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
        }
        .btn-back {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            text-decoration: none;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .btn-back:hover {
            background-color: #30363d;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-section">
            <svg height="32" viewBox="0 0 16 16" width="32" aria-hidden="true">
                <path d="M8 0c4.42 0 8 3.58 8 8 0 3.54-2.29 6.53-5.47 7.59-.4.07-.55-.17-.55-.38 0-.19.01-.82.01-1.49 2.01.37 2.53-.49 2.69-.94.09-.23.48-.94.82-1.13.28-.15.68-.52.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            <span class="logo-title">Status Systemu</span>
        </div>
    </header>

    <main class="main-container">
        <div class="global-status">
            <div class="status-indicator"></div>
            <div class="global-status-text">Wszystkie systemy działają prawidłowo</div>
        </div>

        <div class="panel">
            <div class="panel-header">Status poszczególnych usług</div>
            
            <div class="status-row">
                <span class="system-name">Strona WWW / Serwer główny</span>
                <span class="system-status">Operacyjny</span>
            </div>
            <div class="status-row">
                <span class="system-name">Baza danych</span>
                <span class="system-status">Operacyjny</span>
            </div>
            <div class="status-row">
                <span class="system-name">API Gateway</span>
                <span class="system-status">Operacyjny</span>
            </div>
            <div class="status-row">
                <span class="system-name">Uwierzytelnianie i sesje</span>
                <span class="system-status">Operacyjny</span>
            </div>
        </div>

        <div class="footer">
            <a href="404.html" class="btn-back">Wróć do błędu 404</a>
        </div>
    </main>
</body>
</html>
