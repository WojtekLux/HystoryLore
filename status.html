<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status systemów · GitHub Style</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 768px;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 32px;
        }
        .logo {
            width: 32px;
            height: 32px;
            fill: #f0f6fc;
            margin-right: 12px;
        }
        .title {
            font-size: 24px;
            font-weight: 600;
            color: #f0f6fc;
            margin: 0;
        }
        .overall-status {
            background-color: rgba(46, 160, 67, 0.15);
            border: 1px solid rgba(46, 160, 67, 0.4);
            border-radius: 6px;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 500;
            color: #3fb950;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
        }
        .indicator {
            width: 10px;
            height: 10px;
            background-color: #2ea043;
            border-radius: 50%;
            margin-right: 12px;
            box-shadow: 0 0 8px #2ea043;
        }
        .panel {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            margin-bottom: 32px;
            overflow: hidden;
        }
        .system-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #30363d;
        }
        .system-row:last-child {
            border-bottom: none;
        }
        .system-name {
            font-size: 16px;
            font-weight: 500;
            color: #f0f6fc;
        }
        .system-status {
            font-size: 14px;
            color: #3fb950;
            font-weight: 500;
        }
        .footer-nav {
            text-align: center;
        }
        .btn-back {
            display: inline-block;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .btn-back:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg class="logo" viewBox="0 0 16 16" version="1.1" aria-hidden="true"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
            <h1 class="title">Status Projektu</h1>
        </div>

        <div class="overall-status">
            <div class="indicator"></div>
            Wszystkie systemy działają prawidłowo
        </div>

        <div class="panel">
            <div class="system-row">
                <div class="system-name">Strona Główna (GitHub Pages)</div>
                <div class="system-status">Operacyjny</div>
            </div>
            <div class="system-row">
                <div class="system-name">Baza Danych Lore</div>
                <div class="system-status">Operacyjny</div>
            </div>
            <div class="system-row">
                <div class="system-name">Komponenty UI</div>
                <div class="system-status">Operacyjny</div>
            </div>
        </div>

        <div class="footer-nav">
            <a href="404.html" class="btn-back">Wróć do poprzedniej strony</a>
        </div>
    </div>
</body>
</html>
